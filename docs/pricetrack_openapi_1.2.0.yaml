    "/exports-external": {
      "get": {
        "summary": "Listar exports em massa da organização",
        "description": "Retorna a lista paginada de todos os exports em massa solicitados pela organização (autenticada via header `token`), ordenados do mais recente para o mais antigo. A posição 0 do array `data` é sempre o export mais recente — útil para acompanhar o último export disparado sem precisar guardar IDs localmente.\n\nCada item tem o mesmo shape do GET por ID (`/exports-external/{exportId}`) e, quando `status=DONE`, já vem com `downloadUrl` (presigned, válida por 1h) — evitando uma segunda chamada para baixar o arquivo.",
        "parameters": [
          {
            "name": "page",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "default": 1,
              "example": 1
            },
            "description": "Número da página (1-indexed)."
          },
          {
            "name": "take",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 20,
              "example": 20
            },
            "description": "Quantidade de itens por página (máx. 100)."
          }
        ],
        "responses": {
          "200": {
            "description": "Lista de exports.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ExportListResponse"
                }
              }
            }
          },
          "400": {
            "description": "Parâmetros de paginação inválidos.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error400"
                }
              }
            }
          },
          "401": {
            "description": "Não autorizado.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error401"
                }
              }
            }
          }
        }
      }
    },
    "/exports-external/{exportId}": {
      "get": {
        "summary": "Consultar status de um export em massa",
        "description": "Retorna o status atual do export. Quando status=DONE, inclui downloadUrl (URL pré-assinada com TTL de 1 hora) para download direto do arquivo NDJSON.gz. O cliente deve fazer polling neste endpoint até obter status=DONE ou status=FAILED.",
        "parameters": [
          {
            "name": "exportId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            },
            "description": "ID do export retornado por POST /exports-external/collects-offers ou /collects-shipping."
          }
        ],
        "responses": {
          "200": {
            "description": "Status atual do export.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ExportStatusResponse"
                }
              }
            }
          },
          "401": {
            "description": "Não autorizado.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error401"
                }
              }
            }
          },
          "403": {
            "description": "O export pertence a outra organização.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error403"
                }
              }
            }
          },
          "404": {
            "description": "Export não encontrado.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error404"
                }
              }
            }
          }
        }
      }
    }
  }
