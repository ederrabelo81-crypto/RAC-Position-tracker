    "/exports-external/collects-offers": {
      "post": {
        "summary": "Criar export em massa de ofertas (NDJSON.gz)",
        "description": "Cria um job assíncrono que gera um arquivo NDJSON gzipado com TODAS as ofertas coletadas no dia informado, aplicando filtros opcionais. Retorna imediatamente um exportId; o cliente deve fazer polling em GET /exports-external/{exportId} até status=DONE para obter a URL de download.\n\nIdeal para grandes volumes de dados (centenas de milhares ou milhões de linhas) — alternativa ao endpoint paginado /collects-offers-external.\n\nPara poucos produtos, envie `skus`: o export lê só as ofertas deles, em vez do dia inteiro.\n\nLimite: máximo de 3 exports concorrentes (pending/processing) por organização.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ExportRequestOffers"
              }
            }
          }
        },
        "responses": {
          "202": {
            "description": "Export aceito e enfileirado para processamento.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ExportCreateResponse"
                }
              }
            }
          },
          "400": {
            "description": "Filtros inválidos (data fora do intervalo permitido, formato incorreto, etc.).",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error400"
                }
              }
            }
          },
          "401": {
            "description": "Não autorizado.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error401"
                }
              }
            }
          },
          "429": {
            "description": "Limite de exports concorrentes atingido.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error429"
                }
              }
            }
          }
        }
      }
    },
    "/exports-external/collects-offers-v2": {
      "post": {
        "summary": "Criar export em massa de ofertas via Redis (NDJSON.gz) [V2]",
        "description": "Versão 2 do endpoint de export em massa de ofertas. Lê os dados diretamente do cache Redis (price_matrix), eliminando I/O nas tabelas particionadas do PostgreSQL durante a janela de coleta ativa.\n\nMesmo contrato de request e resposta que POST /exports-external/collects-offers (V1). Retorna imediatamente um exportId; polling em GET /exports-external/{exportId} até status=DONE.\n\n**Diferenças em relação ao V1:**\n- `title` (título da oferta) → sempre `null` (não armazenado no Redis)\n- `collection_hour` → sempre `null`\n- `collection_hour_execution` → truncado em HH:MM (segundos não armazenados)\n- `url` → resolvido via lookup na partição do dia (disponível, porém em batch)\n- Janela de datas limitada à retenção do Redis (últimos 90 dias, contando hoje)\n\nLimite: máximo de 3 exports concorrentes (pending/processing) por organização.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ExportRequestOffers"
              }
            }
          }
        },
        "responses": {
          "202": {
            "description": "Export aceito e enfileirado para processamento.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ExportCreateResponse"
                }
              }
            }
          },
          "400": {
            "description": "Filtros inválidos — inclui data fora da janela de retenção do Redis (use o V1 para datas mais antigas).",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error400"
                }
              }
            }
          },
          "401": {
            "description": "Não autorizado.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error401"
                }
              }
            }
          },
          "429": {
            "description": "Limite de exports concorrentes atingido.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error429"
                }
              }
            }
          }
        }
      }
    },
