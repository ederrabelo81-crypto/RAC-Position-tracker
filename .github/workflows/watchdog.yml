name: Watchdog de Coleta

# ──────────────────────────────────────────────────────────────────────────────
# Roda scripts/daily_status_check.py todo dia e alerta no Telegram.
#
# Por que este workflow existe
# ----------------------------
# Entre 16 e 25/07/2026 a coleta rodou normalmente, produziu ~5,6 mil registros
# por dia e gravou ZERO — o Supabase estava restrito por cota (HTTP 402) e
# recusava toda escrita. Os workflows terminavam VERDES, porque o upload
# rejeitado não derruba o job. Ninguém percebeu por nove dias.
#
# O `daily_status_check.py` detectaria isso no primeiro dia, mas não estava
# agendado em lugar nenhum. Este arquivo é a correção: o watchdog não olha se o
# job terminou bem — olha se o DADO chegou.
#
# Segunda rodada (31/07/2026): o histórico no Drive, montado em 26/07 como
# redundância, passou cinco dias sem escrever um único arquivo. O watchdog não
# viu porque só sabia perguntar ao Supabase — e, com o banco restrito, morria
# no exit 2 antes de perguntar qualquer coisa. Agora ele checa o frio PRIMEIRO
# e alerta mesmo sem banco.
#
# Horário: 23:30 UTC = 20:30 BRT, depois da coleta da noite (21:00 BRT roda em
# 00:00 UTC do dia seguinte; a de abertura, 10:00 BRT, já passou). Assim o
# relatório cobre o dia inteiro que está fechando.
#
# Exit codes do script (viram o status do job):
#   0 — todas as plataformas críticas PASS
#   1 — o DADO não chegou: plataforma crítica WARN/FAIL, ou histórico frio FAIL
#   2 — Supabase não CONFIGURADO (SUPABASE_URL/KEY ausentes, pacote faltando)
#   3 — Supabase rejeitou a CREDENCIAL (401/403, chave inválida ou revogada)
#   4 — Supabase inacessível (rede, timeout, 5xx, projeto restrito por cota)
#
# 2, 3 e 4 dizem que o watchdog não conseguiu OLHAR — não que a coleta falhou.
# Eram todos o mesmo exit 2 até Ago/2026, e nove runs seguidos em vermelho por
# `401 Unregistered API key` ficaram indistinguíveis de "não veio dado", com a
# causa real só no meio do log. Agora o código, o banner no terminal e o título
# do alerta dizem qual dos dois é.
#
# Secrets necessários (Settings → Secrets and variables → Actions):
#   SUPABASE_URL, SUPABASE_KEY — leitura da tabela `coletas`
#   TELEGRAM_BOT_TOKEN, N8N_TELEGRAM_CHAT_ID — destino do alerta
#
# ⚠️ Enquanto o Supabase estiver restrito por cota (ou com a chave inválida),
# este workflow vai FALHAR todo dia. Isso é o comportamento correto — ele está
# sinalizando um problema real e não resolvido. Para silenciar, resolva a causa
# (cota: veja scripts/retention_cleanup.sql; credencial: renove SUPABASE_KEY),
# não desligue o watchdog.
# ──────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '30 23 * * *'   # 20:30 BRT — depois da coleta de abertura e antes da virada
  workflow_dispatch:
    inputs:
      data:
        description: 'Dia a verificar YYYY-MM-DD (vazio = hoje)'
        required: false
        default: ''
      turno:
        description: 'Turno específico (Abertura | Fechamento). Vazio = ambos.'
        required: false
        default: ''

env:
  PYTHON_VERSION: '3.11'
  TZ: America/Sao_Paulo

# Duas execuções simultâneas só duplicariam o alerta no Telegram.
concurrency:
  group: watchdog-coleta
  cancel-in-progress: false

jobs:
  check:
    name: Validação diária das plataformas
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      # O watchdog lê o banco e o histórico frio, e notifica — não precisa de
      # Playwright nem dos scrapers, então instalar o requirements inteiro
      # seria desperdício. pyarrow + libs do Google entram porque sem elas o
      # check do frio se degrada para "indisponível" e o watchdog volta a ser
      # cego justamente para o backup.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install supabase python-dotenv loguru requests pandas tenacity \
                      pyarrow google-api-python-client google-auth

      - name: Run daily status check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          N8N_TELEGRAM_CHAT_ID: ${{ secrets.N8N_TELEGRAM_CHAT_ID }}
          # Leitura do histórico frio. Sem estes secrets o check reporta
          # "Drive configurado mas indisponível" — que é a verdade, e é
          # exatamente o que o alerta deve dizer.
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.data }}" ]; then
            ARGS="$ARGS --data ${{ github.event.inputs.data }}"
          fi
          if [ -n "${{ github.event.inputs.turno }}" ]; then
            ARGS="$ARGS --turno ${{ github.event.inputs.turno }}"
          fi
          echo "Executando: python scripts/daily_status_check.py $ARGS"
          python scripts/daily_status_check.py $ARGS
