name: RAC Price Collection

# ──────────────────────────────────────────────────────────────────────────────
# Backup MANUAL de coleta (workflow_dispatch). O cron foi DESLIGADO em Set/2026.
#
# Desde Set/2026 o PC coletor (Windows, IP residencial) é o coletor ÚNICO de
# oferta/posição: roda TODAS as plataformas nos três turnos (8h/14h/20h BRT) via
# scripts/collect_local_authenticated.bat (Chrome real e logado). Este workflow
# deixa de rodar automaticamente para não haver dois donos do mesmo dado — o
# registro de execução (utils/pipeline_registry.py) atribui cada (plataforma,
# turno) ao PC.
#
# Ele CONTINUA disponível como backup manual: se o PC ficar dias fora, dá para
# disparar aqui uma coleta das plataformas que funcionam de IP de datacenter.
# Lembrando das limitações do runner (não é uma regressão, é o ambiente):
#   - ml, magalu, shopee, casasbahia → Akamai/anti-bot barra o IP de datacenter
#     antes do fingerprint; rendem ~0 registro. Só destravam no PC.
#   - google_shopping, amazon, leroy → rodam de IP de datacenter.
#   - dealers → melhor de IP residencial (PC).
#
# Variáveis obrigatórias (Settings → Secrets and variables → Actions):
#   SUPABASE_URL   —  URL do projeto Supabase
#   SUPABASE_KEY   —  chave de serviço (service_role)
#   GDRIVE_*       —  histórico frio no Drive (4 valores; ver docs/HISTORICO_DRIVE.md)
# ──────────────────────────────────────────────────────────────────────────────

on:
  # Cron removido em Set/2026 (PC coletor é o dono único). Reativar aqui só se
  # a coleta local for descontinuada — e então mover a posse de volta no
  # utils/pipeline_registry.py para não gerar dois donos do mesmo (plataforma, turno).
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Plataformas separadas por espaço (ml/magalu/shopee/casasbahia só destravam com IP residencial)'
        required: false
        default: 'google_shopping amazon leroy'
      pages:
        description: 'Páginas por keyword (1–5)'
        required: false
        default: '2'
      priority:
        description: 'Prioridade (alta, media, baixa — vazio = todas)'
        required: false
        default: ''

env:
  PYTHON_VERSION: '3.11'
  TZ: America/Sao_Paulo

jobs:
  collect:
    name: Coleta de Preços RAC
    runs-on: ubuntu-latest
    timeout-minutes: 300   # 5 h — suficiente para varredura completa

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      # Actions no major mais recente (node24). O runner passou a avisar de
      # deprecação do Node 20 em todo run, enterrando os avisos que importam.
      # checkout@v7 muda o default só para `pull_request_target`/`workflow_run`
      # (recusa checar out código de fork sem opt-in) — este workflow roda por
      # `schedule`/`workflow_dispatch`, então não é afetado.
      - name: Checkout repo
        uses: actions/checkout@v7

      # ── 2. Parâmetros do run (schedule vs. manual) ─────────────────────────
      - name: Set run parameters
        id: params
        env:
          # O cron que AGENDOU o run — não a hora em que ele conseguiu começar.
          # Um run das 13:00 UTC que entra na fila e só arranca às 18:20 (esta
          # série tem atrasos rotineiros de 35 a 80 minutos, e o PriceTrack já
          # teve de 10h) era classificado pelo relógio como Fechamento: gravava
          # o turno errado no dado E batia ponto como o job errado, deixando a
          # Abertura constar como "não executou" enquanto ela rodava.
          CRON: ${{ github.event.schedule }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "$CRON" in
              '0 13 * * *')
                TURNO="Abertura"
                PAGES="2"
                PRIORITY="alta media"
                ;;
              *)
                TURNO="Fechamento"
                PAGES="1"
                PRIORITY="alta"
                ;;
            esac
            # Só o que coleta de um IP de datacenter. Fora daqui, e por quê:
            #   ml, magalu, shopee, casasbahia → exigem IP residencial e sessão
            #     logada; rodam no notebook por scripts/collect_local_authenticated.bat.
            #     Aqui davam circuit breaker do Akamai e 0 registros, gastando o
            #     tempo do run para não trazer nada.
            #   dealers → ACTIVE_PLATFORMS["dealers"]=False desde Mai/2026 (foco
            #     em buy box de marketplace). Passar o nome explicitamente
            #     ignorava esse desligamento.
            PLATFORMS="google_shopping amazon leroy"
          else
            TURNO="Manual"
            PLATFORMS="${{ github.event.inputs.platforms }}"
            PAGES="${{ github.event.inputs.pages }}"
            PRIORITY="${{ github.event.inputs.priority }}"
          fi

          # Id do job no livro-razão de execução (utils/pipeline_registry.py).
          # É o que permite ao supervisor dizer "a coleta da Abertura não
          # rodou" em vez de só "não achei dado" — que é indistinguível de
          # "rodou e veio vazio".
          case "$TURNO" in
            Abertura)   JOB_ID="gh_collect_abertura"   ;;
            Fechamento) JOB_ID="gh_collect_fechamento" ;;
            *)          JOB_ID=""                      ;;  # manual não bate ponto
          esac

          echo "job_id=$JOB_ID"     >> "$GITHUB_OUTPUT"
          echo "turno=$TURNO"       >> "$GITHUB_OUTPUT"
          echo "platforms=$PLATFORMS" >> "$GITHUB_OUTPUT"
          echo "pages=$PAGES"       >> "$GITHUB_OUTPUT"
          echo "priority=$PRIORITY" >> "$GITHUB_OUTPUT"

          echo "=== Parâmetros do run ==="
          echo "  Turno    : $TURNO"
          echo "  Platforms: $PLATFORMS"
          echo "  Pages    : $PAGES"
          echo "  Priority : ${PRIORITY:-'(todas)'}"

      # ── 3. Python ──────────────────────────────────────────────────────────
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      # ── 4. Dependências Python ─────────────────────────────────────────────
      - name: Install Python dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt

      # ── 5. Perfil Chrome cacheado (Akamai trust acumula entre runs) ────────
      - name: Restore Magalu Chrome profile cache
        uses: actions/cache@v6
        with:
          path: data/magalu_chrome_profile
          key: magalu-chrome-profile-v1-${{ runner.os }}
          restore-keys: |
            magalu-chrome-profile-v1-

      # ── 6. Playwright + dependências de sistema ────────────────────────────
      - name: Install Playwright browsers and system dependencies
        run: |
          playwright install-deps chromium
          playwright install chromium

      # ── 7. xvfb — display virtual para Magalu (bypassa sensor.js Akamai) ──
      - name: Install xvfb (virtual display for Magalu)
        run: sudo apt-get install -y xvfb

      # ── 7b. Destino do histórico frio ─────────────────────────────────────
      - name: Check cold history destination
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          # A pasta sozinha já faz `resolve_backend_name()` responder "drive",
          # mas sem credencial o backend falha na primeira escrita e o histórico
          # cai no disco do runner. Por isso os dois lados são checados aqui.
          FALTANDO=""
          if [ -z "$GDRIVE_FOLDER_ID" ]; then
            FALTANDO="GDRIVE_FOLDER_ID"
          fi

          # Conta de serviço (Workspace + Shared Drive) dispensa o trio OAuth.
          if [ -z "$GDRIVE_SERVICE_ACCOUNT_JSON" ]; then
            for VAR in GDRIVE_CLIENT_ID GDRIVE_CLIENT_SECRET GDRIVE_REFRESH_TOKEN; do
              if [ -z "${!VAR}" ]; then
                FALTANDO="${FALTANDO:+$FALTANDO, }$VAR"
              fi
            done
          fi

          if [ -n "$FALTANDO" ]; then
            echo "::warning title=Histórico frio sem Drive::Secrets ausentes: \
          $FALTANDO. O Parquet será gravado no disco efêmero do runner e perdido \
          no fim do job (CSV e Parquet seguem como artifact). Ver \
          docs/HISTORICO_DRIVE.md."
          else
            echo "Histórico frio → Google Drive (pasta ${GDRIVE_FOLDER_ID:0:6}…)"
          fi

      # ── 8. Coleta Python ───────────────────────────────────────────────────
      - name: Run Python collector (xvfb + MAGALU_HEADLESS=false)
        id: collect
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # Histórico frio no Drive. O runner é efêmero: sem estas credenciais o
          # Parquet é gravado no disco do runner e some junto com a máquina — a
          # coleta "funciona" e o histórico não chega a lugar nenhum. Cadastre os
          # quatro valores como secrets do repositório (ver docs/HISTORICO_DRIVE.md).
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          MAGALU_HEADLESS: 'false'
          CI: 'true'
          # main.py bate o ponto (início/fim, contagem por plataforma e quais
          # vieram ZERADAS) quando esta variável está definida. Vazia em run
          # manual: execução avulsa não é um job agendado que alguém cobra.
          RAC_JOB_ID: ${{ steps.params.outputs.job_id }}
        run: |
          PLATFORMS="${{ steps.params.outputs.platforms }}"
          PAGES="${{ steps.params.outputs.pages }}"
          PRIORITY="${{ steps.params.outputs.priority }}"

          CMD="python main.py --platforms $PLATFORMS --pages $PAGES"
          if [ -n "$PRIORITY" ]; then
            CMD="$CMD --priority $PRIORITY"
          fi

          echo "Turno   : ${{ steps.params.outputs.turno }}"
          echo "Comando : xvfb-run -a $CMD"
          xvfb-run -a --server-args="-screen 0 1366x768x24" $CMD

      # ── 9. Salva CSVs como artefato ────────────────────────────────────────
      # `output/raw_*.csv` é o dump bruto que o main.py grava ANTES de
      # qualquer formatação. É o que resta quando a exportação do CSV falha —
      # deixá-lo fora daqui manteria o buraco do run #174 aberto: o dado
      # existiria no runner efêmero e sumiria com a máquina. Vem listado
      # explicitamente (mesmo já casando com `output/*.csv`) para que uma
      # mudança futura naquele glob não o derrube junto sem querer.
      #
      # upload-artifact ≥v4 exige NOME ÚNICO por step (não dá mais para dois
      # steps escreverem no mesmo artifact). Os dois steps abaixo já usam nomes
      # distintos (`rac-coleta-…` e `rac-logs-…`), então o bump de major não
      # pede ajuste extra.
      - name: Upload CSV artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rac-coleta-${{ steps.params.outputs.turno }}-${{ github.run_id }}
          path: |
            output/*.csv
            output/raw_*.csv
            data/history/**/*.parquet
          retention-days: 30
          if-no-files-found: warn

      # ── 10. Salva logs ─────────────────────────────────────────────────────
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rac-logs-${{ steps.params.outputs.turno }}-${{ github.run_id }}
          path: |
            logs/*.log
            logs/dealer_debug_*.html
          retention-days: 7
          if-no-files-found: ignore

      # ── 10b. Batida de fracasso do JOB (não do main.py) ───────────────────
      # main.py já bate SUCCESS/PARTIAL/FAILED por conta própria, com contagem
      # por plataforma e a lista das ZERADAS. Este passo cobre só o caso em que
      # ele NÃO chegou a bater: falha de dependência antes da coleta,
      # cancelamento, runner perdido.
      #
      # A condição exclui `steps.collect.outcome == 'failure'` de propósito: se
      # o main.py rodou e saiu != 0, ele já gravou um FAILED com o motivo real
      # ("persistência falhou: upload Supabase"), e `ultimas_batidas()` devolve
      # sempre a batida MAIS RECENTE — um segundo FAILED genérico aqui apagaria
      # esse diagnóstico do alerta e deixaria só "o job falhou".
      #
      # Runner morto e timeout de 5h continuam sem passo nenhum: ali o STARTED
      # do main.py fica sozinho e o supervisor reporta TRAVADO depois do
      # deadline — veredito correto e distinto de "não executou".
      - name: Heartbeat — job failure
        if: >-
          (failure() || cancelled())
          && steps.params.outputs.job_id != ''
          && steps.collect.outcome != 'failure'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python -m utils.heartbeat --job "${{ steps.params.outputs.job_id }}" \
            --status FAILED --detail "job do Actions falhou antes de concluir"

      # ── 11. Alerta de falha ────────────────────────────────────────────────
      # Doze coletas agendadas morreram entre 26 e 31/07/2026 e o único sinal
      # foi o X vermelho na aba Actions, que ninguém abre todo dia. O watchdog
      # das 20:30 BRT olha se o DADO chegou; este passo avisa que o JOB caiu —
      # são falhas diferentes e a segunda precede a primeira em várias horas.
      #
      # Envio direto pela Bot API: um passo de notificação não pode depender do
      # ambiente Python que acabou de falhar. Sem os secrets, não faz nada.
      - name: Notify collection failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.N8N_TELEGRAM_CHAT_ID }}
          TURNO: ${{ steps.params.outputs.turno }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "::warning title=Alerta não enviado::TELEGRAM_BOT_TOKEN ou \
          N8N_TELEGRAM_CHAT_ID ausente — a falha desta coleta não foi notificada."
            exit 0
          fi
          TEXT="🔴 <b>Coleta RAC FALHOU</b> — turno ${TURNO}
          O job terminou em erro: ao menos uma etapa de persistência (CSV, histórico frio ou Supabase) não concluiu.
          O dado coletado segue no artifact do run (CSV formatado + <code>raw_*.csv</code>) — confira o log antes de recoletar.
          Log: ${RUN_URL}"
          curl -sS -m 30 -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "parse_mode=HTML" \
            --data-urlencode "text=${TEXT}" \
            -o /dev/null || echo "::warning title=Alerta não enviado::curl falhou."
