name: PriceTrack Daily Import

# ──────────────────────────────────────────────────────────────────────────────
# Importa diariamente os preços do PriceTrack (fonte de verdade Midea) para a
# tabela Supabase `pricetrack_daily`, que o dashboard Streamlit já lê com
# precedência por data sobre a tabela `coletas`.
#
# O script scripts/pricetrack_api_import.py já é incremental e idempotente:
#   • --end default = ontem
#   • date_exists() pula datas já presentes no banco (sem --force)
#   • upsert ON CONFLICT em pricetrack_daily
# Logo, este workflow só precisa disparar o comando uma vez por dia.
#
# Schedule (UTC):
#   09:00 UTC = 06:00 BRT  → importa a coleta de ONTEM (já fechada no PriceTrack)
#
# Variáveis obrigatórias (Settings → Secrets and variables → Actions):
#   PRICETRACK_API_KEY  —  token da API do PriceTrack (Configurações → API)
#   SUPABASE_URL        —  URL do projeto Supabase
#   SUPABASE_KEY        —  chave de serviço (service_role)
#
# Recomendados — sem eles o histórico frio cai no disco do runner e some com o
# job (o Parquet ainda sobe no artifact, mas expira em 14 dias):
#   GDRIVE_CLIENT_ID · GDRIVE_CLIENT_SECRET · GDRIVE_REFRESH_TOKEN
#   GDRIVE_FOLDER_ID    —  ver docs/HISTORICO_DRIVE.md
# ──────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '0 9 * * *'    # 06:00 BRT — importa o dia anterior
  workflow_dispatch:
    inputs:
      start:
        description: 'Data inicial YYYY-MM-DD (vazio = ontem). Use para backfill.'
        required: false
        default: ''
      end:
        description: 'Data final YYYY-MM-DD (vazio = ontem)'
        required: false
        default: ''
      force:
        description: 'Reimportar datas já presentes no banco (true/false)'
        required: false
        default: 'false'

env:
  PYTHON_VERSION: '3.11'
  TZ: America/Sao_Paulo

# Evita dois imports concorrentes gravando na mesma tabela
concurrency:
  group: pricetrack-daily
  cancel-in-progress: false

jobs:
  import:
    name: Import PriceTrack → Supabase
    runs-on: ubuntu-latest
    # INVARIANTE: este teto precisa ser MAIOR que a soma dos
    # `timeout-minutes` de TODOS os passos de import, mais folga para
    # checkout/deps/upload. Hoje: 50 (import) + 60 (heal) = 110 < 120 ✓
    #
    # Cuidado ao raciocinar por `PRICETRACK_POLL_TIMEOUT_SECONDS`: ele é o
    # timeout de UM export (`pricetrack_api/config.py: poll_timeout_seconds`),
    # não do passo. Com `max_concurrent_exports = 3`, um passo com N exports
    # custa, no pior caso, ceil(N/3) × poll_timeout — e o `Heal recent gaps`
    # varre até 14 datas, ou seja ceil(14/3) = 5 lotes ≈ 3h45 se cada lote
    # esgotar o limite. Somar os polls dos passos, como esta nota fazia antes,
    # subestima o pior caso e deixa o job estourar de novo.
    #
    # Por isso o teto real de cada passo é o `timeout-minutes` do passo, que o
    # GitHub impõe independentemente de quantos exports rodaram. O teto do job
    # protege o resto do workflow.
    #
    # Estava em 60min sem teto por passo: o import consumia o orçamento e o
    # `Heal recent gaps` era morto pelo runner no meio do voo — runs de 08, 09
    # e 10/08/2026 cancelados exatamente aos 60min, deixando `pricetrack_daily`
    # parada em 06/08. Pior, o job morto no meio é a própria causa dos exports
    # órfãos que travam os 3 slots da organização.
    timeout-minutes: 120

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repo
        uses: actions/checkout@v4

      # ── 2. Python ──────────────────────────────────────────────────────────
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      # ── 3. Dependências (subset — sem Playwright/browser) ──────────────────
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests pandas supabase python-dotenv loguru

      # ── 4. Parâmetros do run (schedule vs. manual) ─────────────────────────
      - name: Set run parameters
        id: params
        run: |
          YESTERDAY=$(date -u -d 'yesterday' +%F)
          START="${{ github.event.inputs.start }}"
          END="${{ github.event.inputs.end }}"
          FORCE="${{ github.event.inputs.force }}"

          # Defaults: ambos = ontem (import incremental do dia anterior)
          START="${START:-$YESTERDAY}"
          END="${END:-$YESTERDAY}"

          # O run agendado SEMPRE força: um import intra-dia MANUAL
          # (`pricetrack_import_linux.sh today`) pode ter gravado linhas
          # provisórias para o dia (parciais, só manhã/tarde coletadas até ali).
          # Sem --force, date_exists() pularia esse D-1 e a versão parcial
          # ficaria como definitiva. Forçar re-importa o dia já fechado e
          # sobrescreve (upsert) a provisória pela completa — também auto-cura
          # primeiros imports parciais.
          FORCE_FLAG=""
          if [ "$FORCE" = "true" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            FORCE_FLAG="--force"
          fi

          echo "start=$START"           >> "$GITHUB_OUTPUT"
          echo "end=$END"               >> "$GITHUB_OUTPUT"
          echo "force_flag=$FORCE_FLAG" >> "$GITHUB_OUTPUT"

          echo "=== Parâmetros do import ==="
          echo "  Start: $START"
          echo "  End  : $END"
          echo "  Force: ${FORCE:-false}"

      # ── 5. Import PriceTrack → Supabase ────────────────────────────────────
      - name: Run PriceTrack API import
        # Teto imposto pelo runner, independente de quantos exports rodaram.
        # `PRICETRACK_POLL_TIMEOUT_SECONDS` limita UM export, não o passo.
        timeout-minutes: 50
        env:
          PRICETRACK_API_KEY: ${{ secrets.PRICETRACK_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # 40min POR EXPORT (não pelo passo — quem limita o passo é o
          # `timeout-minutes: 50` acima). Serve para um export travado não
          # segurar sozinho o passo inteiro.
          # INVARIANTE: RUN_BUDGET >= POLL_TIMEOUT. Com o orçamento menor que
          # o timeout de um export, `_budget_exhausted()` dá True na primeira
          # iteração e o passo termina sem submeter NADA — o config valida
          # isso e falha alto, mas a ordem certa dos números mora aqui:
          #   poll 2400s <= budget 2700s < teto de parede 3000s (50min)
          PRICETRACK_POLL_TIMEOUT_SECONDS: "2400"
          # 45min de orçamento sob o teto de parede de 50min: o cliente para
          # de submeter export que não caberia e sai limpo, em vez de ser
          # morto pelo runner deixando exports órfãos nos 3 slots.
          PRICETRACK_RUN_BUDGET_SECONDS: "2700"
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          python scripts/pricetrack_api_import.py \
            --start "${{ steps.params.outputs.start }}" \
            --end "${{ steps.params.outputs.end }}" \
            ${{ steps.params.outputs.force_flag }}

      # ── 5b. Auto-heal: preenche buracos dos últimos 14 dias (só agendado) ──
      # Evita que falhas transitórias da API deixem datas faltando no histórico
      # (ex.: 14/01, 18-20/02, 05/05, 08/05 — gaps detectados em 02/06/2026).
      - name: Heal recent gaps
        if: github.event_name == 'schedule'
        # Varre até 14 datas em lotes de 3 (`max_concurrent_exports`), então o
        # pior caso por poll seria ceil(14/3) x 45min ≈ 3h45 — muito além do
        # job. Quem segura o passo é o par abaixo:
        #   • `timeout-minutes` — teto de parede imposto pelo runner;
        #   • `PRICETRACK_RUN_BUDGET_SECONDS` — orçamento que o cliente
        #     respeita, parando de SUBMETER exports que não caberiam. Fica
        #     abaixo do teto de parede de propósito: o cliente sai sozinho e
        #     limpo, antes de o runner matar o processo no meio de um lote em
        #     voo (export morto no meio fica órfão segurando um dos 3 slots).
        # Sem `continue-on-error`: um heal que falha de verdade (401/429,
        # crash) precisa pintar o run de vermelho, senão a coleta fica com
        # buracos e nada avisa — o oposto do que este PR quer. O truncamento
        # por orçamento não é falha: o cliente devolve o lote incompleto e sai
        # com sucesso, e o run seguinte retoma os buracos.
        timeout-minutes: 60
        env:
          # 50min de orçamento dentro de um teto de parede de 60min.
          PRICETRACK_RUN_BUDGET_SECONDS: "3000"
          PRICETRACK_API_KEY: ${{ secrets.PRICETRACK_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # 45min POR EXPORT; o teto do passo é o `timeout-minutes: 60`.
          # Era este o passo cancelado pelo runner nos runs de 08-10/08/2026,
          # porque o import anterior já tinha gasto o orçamento de 60min do job.
          PRICETRACK_POLL_TIMEOUT_SECONDS: "2700"
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          GAP_START=$(date -u -d '14 days ago' +%F)
          GAP_END=$(date -u -d 'yesterday' +%F)
          python scripts/pricetrack_api_import.py \
            --start "$GAP_START" --end "$GAP_END" --gaps-only

      # ── 6. Salva logs como artefato ────────────────────────────────────────
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pricetrack-import-logs-${{ github.run_id }}
          path: |
            logs/pricetrack_api_import_*.log
            data/history/**/*.parquet
          retention-days: 14
          if-no-files-found: ignore
