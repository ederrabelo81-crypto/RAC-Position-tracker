name: PriceTrack Daily Import

# ──────────────────────────────────────────────────────────────────────────────
# Importa diariamente os preços do PriceTrack (fonte de verdade Midea) para a
# tabela Supabase `pricetrack_daily`, que o dashboard Streamlit já lê com
# precedência por data sobre a tabela `coletas`.
#
# O script scripts/pricetrack_api_import.py já é incremental e idempotente:
#   • --end default = ontem
#   • date_exists() pula datas já presentes no banco (sem --force)
#   • upsert ON CONFLICT em pricetrack_daily
# Logo, este workflow só precisa disparar o comando uma vez por dia.
#
# Schedule (UTC) — ESCADA DE TRÊS TENTATIVAS (Ago/2026):
#   03:01 UTC = 00:01 BRT  → 1ª tentativa (com --force: fecha o dia)
#   07:20 UTC = 04:20 BRT  → 2ª tentativa (no-op se D-1 já entrou)
#   08:20 UTC = 05:20 BRT  → 3ª tentativa + auto-heal dos últimos 14 dias
#
# Por que três, e por que tão cedo
# --------------------------------
# Estava em `0 9 * * *` (06:00 BRT), uma hora antes do briefing das 07:00. Cron
# do Actions é *best effort* e a fila do topo da hora é a mais disputada: a
# série de agosto/2026 mostra este workflow começando 09:16, 09:29, 09:50,
# 11:11, 12:11 UTC — e, em 27/08, **19:18 UTC**. Naquele dia o briefing das
# 07:00 publicou preço de D-2 e nada avisou, porque o job não tinha falhado:
# ele ainda não tinha rodado.
#
# Uma tentativa uma hora antes do consumidor não tem folga nenhuma para um
# agendamento que atrasa horas. Três tentativas espaçadas, a partir das 00:01,
# dão ~7 horas de margem até o briefing, e o minuto :01 evita a fila do minuto 0.
# O script já é idempotente (`date_exists()` pula data presente), então as
# tentativas 2 e 3 custam segundos quando a 1ª funcionou.
#
# A rede de segurança final é o `pipeline_guard.yml` às 06:35 BRT: se as três
# tentativas falharem, ele reimporta na hora e avisa ANTES da publicação.
#
# Variáveis obrigatórias (Settings → Secrets and variables → Actions):
#   PRICETRACK_API_KEY  —  token da API do PriceTrack (Configurações → API)
#   SUPABASE_URL        —  URL do projeto Supabase
#   SUPABASE_KEY        —  chave de serviço (service_role)
#
# Recomendados — sem eles o histórico frio cai no disco do runner e some com o
# job (o Parquet ainda sobe no artifact, mas expira em 14 dias):
#   GDRIVE_CLIENT_ID · GDRIVE_CLIENT_SECRET · GDRIVE_REFRESH_TOKEN
#   GDRIVE_FOLDER_ID    —  ver docs/HISTORICO_DRIVE.md
# ──────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '1 3 * * *'    # 00:01 BRT — 1ª tentativa (força e fecha o dia)
    - cron: '20 7 * * *'   # 04:20 BRT — 2ª tentativa (no-op se D-1 já entrou)
    - cron: '20 8 * * *'   # 05:20 BRT — 3ª tentativa + auto-heal de 14 dias
  workflow_dispatch:
    inputs:
      start:
        description: 'Data inicial YYYY-MM-DD (vazio = ontem). Use para backfill.'
        required: false
        default: ''
      end:
        description: 'Data final YYYY-MM-DD (vazio = ontem)'
        required: false
        default: ''
      force:
        description: 'Reimportar datas já presentes no banco (true/false)'
        required: false
        default: 'false'

env:
  PYTHON_VERSION: '3.11'
  TZ: America/Sao_Paulo

# Grupo COMPARTILHADO com o `pipeline_guard.yml`: a organização tem 3 slots de
# export no PriceTrack, e o `Heal recent gaps` do 3º degrau varre até 14 datas.
# Se ele ainda estiver rodando quando o portão das 06:35 tentar sua cura, os
# dois clientes disputam os mesmos slots e um dos dois falha — justamente a
# cura de emergência, que é a última rede antes do briefing. Com o mesmo grupo,
# o portão espera o heal terminar em vez de brigar com ele.
concurrency:
  group: pricetrack-exports
  cancel-in-progress: false

jobs:
  import:
    name: Import PriceTrack → Supabase
    runs-on: ubuntu-latest
    # INVARIANTE: este teto precisa ser MAIOR que a soma dos
    # `timeout-minutes` de TODOS os passos de import, mais folga para
    # checkout/deps/upload. Hoje: 50 (import) + 60 (heal) = 110 < 120 ✓
    #
    # Cuidado ao raciocinar por `PRICETRACK_POLL_TIMEOUT_SECONDS`: ele é o
    # timeout de UM export (`pricetrack_api/config.py: poll_timeout_seconds`),
    # não do passo. Com `max_concurrent_exports = 3`, um passo com N exports
    # custa, no pior caso, ceil(N/3) × poll_timeout — e o `Heal recent gaps`
    # varre até 14 datas, ou seja ceil(14/3) = 5 lotes ≈ 3h45 se cada lote
    # esgotar o limite. Somar os polls dos passos, como esta nota fazia antes,
    # subestima o pior caso e deixa o job estourar de novo.
    #
    # Por isso o teto real de cada passo é o `timeout-minutes` do passo, que o
    # GitHub impõe independentemente de quantos exports rodaram. O teto do job
    # protege o resto do workflow.
    #
    # Estava em 60min sem teto por passo: o import consumia o orçamento e o
    # `Heal recent gaps` era morto pelo runner no meio do voo — runs de 08, 09
    # e 10/08/2026 cancelados exatamente aos 60min, deixando `pricetrack_daily`
    # parada em 06/08. Pior, o job morto no meio é a própria causa dos exports
    # órfãos que travam os 3 slots da organização.
    timeout-minutes: 120

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repo
        uses: actions/checkout@v4

      # ── 2. Python ──────────────────────────────────────────────────────────
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      # ── 3. Dependências (subset — sem Playwright/browser) ──────────────────
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests pandas supabase python-dotenv loguru

      # ── 4. Parâmetros do run (schedule vs. manual) ─────────────────────────
      - name: Set run parameters
        id: params
        run: |
          YESTERDAY=$(date -u -d 'yesterday' +%F)
          START="${{ github.event.inputs.start }}"
          END="${{ github.event.inputs.end }}"
          FORCE="${{ github.event.inputs.force }}"

          # Defaults: ambos = ontem (import incremental do dia anterior)
          START="${START:-$YESTERDAY}"
          END="${END:-$YESTERDAY}"

          # Qual degrau da escada é este run? O GitHub não diz qual cron
          # disparou, então a hora UTC é o que separa os três — e ela é o dado
          # certo mesmo com atraso de fila: um run das 06:20 que só começa às
          # 07:40 continua sendo a 1ª tentativa em intenção, mas já se comporta
          # como a 2ª, que é exatamente o desejado (não reforçar um dia que a
          # 1ª tentativa atrasada pode ter acabado de gravar).
          HORA=$(date -u +%H)
          DEGRAU="1"
          if [ "$HORA" = "07" ]; then DEGRAU="2"; fi
          if [ "$HORA" -ge 8 ] 2>/dev/null; then DEGRAU="3"; fi

          # --force só no PRIMEIRO degrau. Motivo: um import intra-dia MANUAL
          # (`pricetrack_import_linux.sh today`) pode ter gravado linhas
          # provisórias para o dia (parciais). Sem --force, date_exists()
          # pularia esse D-1 e a parcial ficaria como definitiva — por isso o
          # 1º degrau força e fecha o dia.
          # Nos degraus 2 e 3, forçar seria reimportar de novo um dia que já
          # entrou completo: três exports por dia em vez de um, gastando os
          # 3 slots de export da organização à toa. Sem --force eles são
          # no-op de segundos e só agem se o degrau anterior falhou — que é a
          # razão de a escada existir.
          FORCE_FLAG=""
          if [ "$FORCE" = "true" ]; then
            FORCE_FLAG="--force"
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "$DEGRAU" = "1" ]; then
            FORCE_FLAG="--force"
          fi

          echo "start=$START"           >> "$GITHUB_OUTPUT"
          echo "end=$END"               >> "$GITHUB_OUTPUT"
          echo "force_flag=$FORCE_FLAG" >> "$GITHUB_OUTPUT"
          echo "degrau=$DEGRAU"         >> "$GITHUB_OUTPUT"

          echo "=== Parâmetros do import ==="
          echo "  Start : $START"
          echo "  End   : $END"
          echo "  Degrau: $DEGRAU de 3 (hora UTC $HORA)"
          echo "  Force : ${FORCE_FLAG:-não}"

      # ── 4a. Diário de exports — persistido ENTRE runs (Set/2026) ───────────
      # `pricetrack_api/journal.py` só evita export duplicado/órfão quando o
      # id sobrevive de uma execução para a outra. Isso já funciona na VM
      # Oracle e no PC coletor (disco persistente), mas NUNCA funcionou aqui:
      # todo run do Actions começa de um `checkout` novo, então o diário
      # nascia vazio e o run seguinte não tinha como reconhecer um export que
      # ELE MESMO criou — via `pipeline_guard.yml` ou uma tentativa anterior
      # desta escada — e ficava preso em "aguardando slot" sem nunca adotar.
      # Cache com chave única + `restore-keys` por prefixo: cada run grava sob
      # uma chave nova (nunca colide) e lê a mais recente de qualquer run
      # anterior — inclusive de `pipeline_guard.yml`, que restaura/salva o
      # MESMO caminho sob o MESMO prefixo.
      - name: Restore PriceTrack export journal
        uses: actions/cache/restore@v4
        with:
          path: imports/pricetrack/api/exports_state.json
          key: pricetrack-exports-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            pricetrack-exports-state-

      # ── 4b. Batida de ponto: começou ──────────────────────────────────────
      # O livro-razão (`pipeline_heartbeat`, migração 015) é o que permite ao
      # supervisor afirmar "este job NÃO rodou" — a única coisa que nenhum
      # monitor do projeto sabia afirmar, e a causa do briefing de D-2 em 27/08.
      - name: Heartbeat — started
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python -m utils.heartbeat --job gh_pricetrack_d1 --status STARTED \
            --detail "degrau ${{ steps.params.outputs.degrau }}/3"

      # ── 5. Import PriceTrack → Supabase ────────────────────────────────────
      - name: Run PriceTrack API import
        # Teto imposto pelo runner, independente de quantos exports rodaram.
        # `PRICETRACK_POLL_TIMEOUT_SECONDS` limita UM export, não o passo.
        timeout-minutes: 50
        env:
          PRICETRACK_API_KEY: ${{ secrets.PRICETRACK_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # Alerta quando TODOS os 3 slots ficam presos por exports que não são
          # deste run (estado que nenhuma execução destrava sozinha). Sem estes,
          # o TelegramAlertSink degrada para só-log.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          N8N_TELEGRAM_CHAT_ID: ${{ secrets.N8N_TELEGRAM_CHAT_ID }}
          # 40min POR EXPORT (não pelo passo — quem limita o passo é o
          # `timeout-minutes: 50` acima). Serve para um export travado não
          # segurar sozinho o passo inteiro.
          # INVARIANTE: RUN_BUDGET >= POLL_TIMEOUT. Com o orçamento menor que
          # o timeout de um export, `_budget_exhausted()` dá True na primeira
          # iteração e o passo termina sem submeter NADA — o config valida
          # isso e falha alto, mas a ordem certa dos números mora aqui:
          #   poll 2400s <= budget 2700s < teto de parede 3000s (50min)
          PRICETRACK_POLL_TIMEOUT_SECONDS: "2400"
          # 45min de orçamento sob o teto de parede de 50min: o cliente para
          # de submeter export que não caberia e sai limpo, em vez de ser
          # morto pelo runner deixando exports órfãos nos 3 slots.
          PRICETRACK_RUN_BUDGET_SECONDS: "2700"
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          python scripts/pricetrack_api_import.py \
            --start "${{ steps.params.outputs.start }}" \
            --end "${{ steps.params.outputs.end }}" \
            ${{ steps.params.outputs.force_flag }}

      # ── 5b. Auto-heal: preenche buracos dos últimos 14 dias (só agendado) ──
      # Evita que falhas transitórias da API deixem datas faltando no histórico
      # (ex.: 14/01, 18-20/02, 05/05, 08/05 — gaps detectados em 02/06/2026).
      # Só no ÚLTIMO degrau da escada: varrer 14 dias três vezes por dia
      # gastaria os 3 slots de export da organização para responder a mesma
      # pergunta, e é justamente o slot ocupado que trava o import do dia.
      - name: Heal recent gaps
        if: github.event_name == 'schedule' && steps.params.outputs.degrau == '3'
        # Varre até 14 datas em lotes de 3 (`max_concurrent_exports`), então o
        # pior caso por poll seria ceil(14/3) x 45min ≈ 3h45 — muito além do
        # job. Quem segura o passo é o par abaixo:
        #   • `timeout-minutes` — teto de parede imposto pelo runner;
        #   • `PRICETRACK_RUN_BUDGET_SECONDS` — orçamento que o cliente
        #     respeita, parando de SUBMETER exports que não caberiam. Fica
        #     abaixo do teto de parede de propósito: o cliente sai sozinho e
        #     limpo, antes de o runner matar o processo no meio de um lote em
        #     voo (export morto no meio fica órfão segurando um dos 3 slots).
        # Sem `continue-on-error`: um heal que falha de verdade (401/429,
        # crash) precisa pintar o run de vermelho, senão a coleta fica com
        # buracos e nada avisa — o oposto do que este PR quer. O truncamento
        # por orçamento não é falha: o cliente devolve o lote incompleto e sai
        # com sucesso, e o run seguinte retoma os buracos.
        timeout-minutes: 60
        env:
          # 50min de orçamento dentro de um teto de parede de 60min.
          PRICETRACK_RUN_BUDGET_SECONDS: "3000"
          PRICETRACK_API_KEY: ${{ secrets.PRICETRACK_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          N8N_TELEGRAM_CHAT_ID: ${{ secrets.N8N_TELEGRAM_CHAT_ID }}
          # 45min POR EXPORT; o teto do passo é o `timeout-minutes: 60`.
          # Era este o passo cancelado pelo runner nos runs de 08-10/08/2026,
          # porque o import anterior já tinha gasto o orçamento de 60min do job.
          PRICETRACK_POLL_TIMEOUT_SECONDS: "2700"
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          GAP_START=$(date -u -d '14 days ago' +%F)
          GAP_END=$(date -u -d 'yesterday' +%F)
          python scripts/pricetrack_api_import.py \
            --start "$GAP_START" --end "$GAP_END" --gaps-only

      # ── 5b2. Diário de exports — funde com gravações concorrentes ──────────
      # `pipeline_guard.yml` também lê e grava este mesmo diário nos runs de
      # varredura, DE PROPÓSITO fora do grupo de concorrência
      # `pricetrack-exports` (não atrasar o alerta por causa de um import de
      # 50min). Sem fundir, um save por último-a-escrever-vence podia
      # sobrescrever — e ESCONDER — um export que aquele outro run acabou de
      # registrar, recriando o mesmo 429 eterno que este diário existe para
      # evitar (achado do cubic no PR que introduziu o cache). A cópia local é
      # preservada à parte, a versão mais recente do cache é buscada de novo, e
      # as duas são fundidas por chave (a mais recente por `created_at` vence)
      # antes de salvar. Ainda resta uma janela de poucos segundos entre o
      # refresh e o save onde uma gravação de terceiros poderia se perder — bem
      # menor que os minutos de janela que existiam antes, e o mesmo risco que
      # o diário já assume em outros lugares (perder uma entrada custa, no
      # pior caso, um export duplicado — nunca um dia de coleta perdido).
      - name: Snapshot local export journal
        if: always()
        run: |
          mkdir -p imports/pricetrack/api
          cp imports/pricetrack/api/exports_state.json \
             imports/pricetrack/api/exports_state.local.json 2>/dev/null || true

      - name: Refresh export journal from cache (pick up concurrent writers)
        if: always()
        uses: actions/cache/restore@v4
        with:
          path: imports/pricetrack/api/exports_state.json
          key: pricetrack-exports-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            pricetrack-exports-state-

      - name: Merge local and remote export journals
        if: always()
        run: |
          python -c "
          import json
          from pathlib import Path

          local_path = Path('imports/pricetrack/api/exports_state.local.json')
          remote_path = Path('imports/pricetrack/api/exports_state.json')

          def load(p):
              try:
                  data = json.loads(p.read_text(encoding='utf-8'))
              except (FileNotFoundError, json.JSONDecodeError):
                  return {}
              return data.get('entries') or {} if isinstance(data, dict) else {}

          local = load(local_path)
          remote = load(remote_path)
          merged = dict(remote)
          for key, entry in local.items():
              other = merged.get(key)
              if other is None or entry.get('created_at', 0) >= other.get('created_at', 0):
                  merged[key] = entry

          remote_path.parent.mkdir(parents=True, exist_ok=True)
          remote_path.write_text(
              json.dumps({'version': 1, 'entries': merged}, ensure_ascii=False, indent=2),
              encoding='utf-8',
          )
          local_path.unlink(missing_ok=True)
          print(f'Diario mesclado: {len(merged)} entrada(s) ({len(local)} local, {len(remote)} remoto).')
          "

      - name: Save PriceTrack export journal
        if: always()
        uses: actions/cache/save@v4
        with:
          path: imports/pricetrack/api/exports_state.json
          key: pricetrack-exports-state-${{ github.run_id }}-${{ github.run_attempt }}

      # ── 5c. Batida de ponto: terminou ─────────────────────────────────────
      # `if: always()` de propósito: o supervisor precisa saber que o job
      # tentou e falhou tanto quanto precisa saber que ele deu certo. Sem a
      # batida de fracasso, uma falha vira indistinguível de "não rodou".
      # O status vem da CONTAGEM em `pricetrack_daily`, não do exit code.
      # `scripts/pricetrack_api_import.py::main()` descarta o retorno de `run()`
      # e sai 0 mesmo quando o export não trouxe nada (`no_data`, resultado
      # vazio, falha de uma data). Derivar SUCCESS de `job.status` marcaria como
      # execução saudável um dia que continua sem linha — e o portão das 06:35
      # confiaria nesse verde. A verdade é o destino.
      - name: Heartbeat — finished
        if: always()
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          JOB_STATUS: ${{ job.status }}
          DEGRAU: ${{ steps.params.outputs.degrau }}
          D1: ${{ steps.params.outputs.start }}
        run: |
          LINHAS=$(python -c "
          import os, sys
          sys.path.insert(0, '.')
          from utils.supabase_client import _get_client
          c = _get_client()
          if c is None:
              print(-1); sys.exit(0)
          try:
              r = c.table('pricetrack_daily').select('id', count='exact') \
                   .eq('collection_date', os.environ['D1']).limit(1).execute()
              print(r.count or 0)
          except Exception:
              print(-1)
          " 2>/dev/null | tail -1)
          LINHAS=${LINHAS:--1}

          if [ "$JOB_STATUS" != "success" ]; then
            STATUS=FAILED
          elif [ "$LINHAS" = "0" ]; then
            # Saiu 0 e o dia continua vazio: execução sem resultado.
            STATUS=PARTIAL
          else
            STATUS=SUCCESS
          fi

          ARGS=(--job gh_pricetrack_d1 --status "$STATUS")
          if [ "$LINHAS" != "-1" ]; then ARGS+=(--rows "$LINHAS"); fi
          python -m utils.heartbeat "${ARGS[@]}" \
            --detail "degrau ${DEGRAU}/3 — D-1 ${D1} — ${LINHAS} linha(s) em pricetrack_daily"

      # ── 6. Salva logs como artefato ────────────────────────────────────────
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pricetrack-import-logs-${{ github.run_id }}
          path: |
            logs/pricetrack_api_import_*.log
            data/history/**/*.parquet
          retention-days: 14
          if-no-files-found: ignore
